# cremote: phone UI for Claude Code sessions.
# Static UI is served from the VPS, so the page loads even when the Mac is asleep;
# /api and /ws go through the reverse SSH tunnel from the host (127.0.0.1:3010).
# 3010 = access.ssh.remotePort in ~/.cremote/config.json; replace it below if you changed it.
# Replace example.com with your domain.
map $http_upgrade $cremote_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name example.com;

    root /var/www/cremote;
    client_max_body_size 12m;

    # hook endpoints are for the local Claude Code only
    location /hook/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5m;
        proxy_buffering off;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cremote_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # iOS читает manifest только с правильным типом; по умолчанию nginx отдаёт octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name example.com;
    return 404; # managed by Certbot
}
